version: 2
models:
  - name: hub_customer
    description: 'Claves de negocio de cliente, una fila por cliente.'
    columns:
      - name: hk_customer
        data_tests: [not_null, unique]
      - name: business_key
        data_tests: [not_null, unique]
  - name: hub_orders
    columns:
      - name: hk_order
        data_tests: [not_null, unique]
  - name: hub_part
    columns:
      - name: hk_part
        data_tests: [not_null, unique]
  - name: hub_supplier
    columns:
      - name: hk_supplier
        data_tests: [not_null, unique]
  - name: sat_customer
    description: 'Versiones del cliente donde cambia el hashdiff (snapshot mensual).'
    columns:
      - name: sat_row_hk
        data_tests: [unique, not_null]
  - name: sat_orders
    columns:
      - name: sat_row_hk
        data_tests: [unique, not_null]
  - name: sat_lineitem
    columns:
      - name: sat_row_hk
        data_tests: [unique, not_null]
  - name: dim_customer
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
  - name: dim_part
    columns:
      - name: part_key
        data_tests: [unique, not_null]
  - name: dim_supplier
    columns:
      - name: supplier_key
        data_tests: [unique, not_null]
  - name: dim_orders
    columns:
      - name: order_key
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
  - name: fact_order_line
    columns:
      - name: hk_lineitem
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: part_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_part')
                field: part_key
      - name: supplier_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_key
